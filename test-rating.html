<!DOCTYPE html>
<html>
  <body style="font-family: Inter, sans-serif; display: flex; justify-content: center; padding-top: 40px;">
    
    <div style="text-align: center;">
      <div style="font-size: 18px; font-weight: 600; margin-bottom: 12px;">
        Rate this entry
      </div>

      <div
        data-lyket-type="rating"
        data-lyket-id="vvdb-test-rating"
        data-lyket-template="custom"
        data-lyket-show-rating="user"

        data-lyket-color-primary="#00c6a2"       <!-- Active icons -->
        data-lyket-color-icon="#b7b7b7"          <!-- Inactive icons -->
        data-lyket-color-text="#333"             <!-- Numbers text -->
        data-lyket-color-background="transparent"
        data-lyket-color-highlight="#8ef2dd"     <!-- Click highlight -->
        data-lyket-font-family="Inter"
        data-lyket-font-size="24px"
      ></div>
    </div>

    <script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_0ba8a20c61113bf11b6f3fef48ae39"></script>
  </body>
</html>
