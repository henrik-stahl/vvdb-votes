<!DOCTYPE html>
<html>
  <head>
    <style>
      /* SIDE-BY-SIDE LAYOUT */
      .vvdb-container {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        gap: 12px;
        padding-top: 10px;
      }

      /* BOX matches Lyket's Updown pill button */
      .vvdb-updown-box {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 6px 12px;
        background: white;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .vvdb-updown-box .lyket-like__icon {
        display: none !important;
      }

      .vvdb-updown-box:hover {
        background-color: #f6f6f6; /* Lyket hover */
      }

      /* PRESSED STATE COLORS */
      .vvdb-updown-box.like-active {
        background-color: rgba(36, 252, 201, 0.4);
        border-color: rgba(36, 252, 201, 0.6);
      }

      .vvdb-updown-box.dislike-active {
        background-color: rgba(255, 202, 255, 0.4);
        border-color: rgba(255, 202, 255, 0.6);
      }

      /* ICON STYLE — Lyket-like */
      .vvdb-icon {
        font-size: 16px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* COUNTER STYLE — matches Lyket */
      .vvdb-count {
        font-weight: 500;
        font-size: 14px;
        color: #444;
      }
    </style>
  </head>

  <body>
    <div class="vvdb-container">

      <!-- 👍 LIKE BUTTON -->
      <div id="vvdb-like-box" class="vvdb-updown-box">
        <div class="vvdb-icon">👍</div>
        <div class="vvdb-count">
          <div
            data-lyket-type="like"
            data-lyket-id="pluribus"
            data-lyket-template="minimal"
          ></div>
        </div>
      </div>

      <!-- 👎 DISLIKE BUTTON -->
      <div id="vvdb-dislike-box" class="vvdb-updown-box">
        <div class="vvdb-icon">👎</div>
        <div class="vvdb-count">
          <div
            data-lyket-type="like"
            data-lyket-id="pluribus"
            data-lyket-template="minimal"
          ></div>
        </div>
      </div>

    </div>

    <!-- Lyket Script -->
    <script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_0ba8a20c61113bf11b6f3fef48ae39"></script>

    <script>
      /*
       * Detect when Lyket marks a button as liked (lyket--liked)
       * and apply the correct "pressed" background style to the box.
       */

      function attachLyketState(boxId, lySelector, activeClass) {
        const box = document.getElementById(boxId);
        const target = box.querySelector(lySelector);

        const observer = new MutationObserver(() => {
          if (target.classList.contains("lyket--liked")) {
            box.classList.add(activeClass);
          } else {
            box.classList.remove(activeClass);
          }
        });

        observer.observe(target, {
          attributes: true,
          attributeFilter: ["class"]
        });
      }

      attachLyketState("vvdb-like-box", "[data-lyket-type='like']", "like-active");
      attachLyketState("vvdb-dislike-box", "[data-lyket-type='like']", "dislike-active");
    </script>

  </body>
</html>
