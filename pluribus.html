<!DOCTYPE html>
<html>
  <head>
    <style>
      /* Layout: side-by-side */
      .vvdb-container {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        gap: 24px;
        padding-top: 12px;
      }

      /* Button box styling */
      .vvdb-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .vvdb-box:hover {
        background-color: #f3f3f3;
      }

      /* Remove ALL Lyket built-in icons */
      [data-lyket-type="like"] .lyket-like__icon,
      [data-lyket-type="like"] .lyket-like__icon-container {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Emoji icon styling */
      .vvdb-emoji {
        font-size: 20px;
        margin-bottom: 6px;
      }

      /* Counter styling */
      .vvdb-count {
        font-size: 14px;
        font-weight: 500;
        color: #444;
      }
    </style>
  </head>

  <body>
    <div class="vvdb-container">

      <!-- LIKE BUTTON -->
      <div class="vvdb-box">
        <div class="vvdb-emoji">👍</div>
        <div class="vvdb-count">
          <div
            data-lyket-type="like"
            data-lyket-id="pluribus-like"
            data-lyket-template="minimal"
          ></div>
        </div>
      </div>

      <!-- DISLIKE BUTTON -->
      <div class="vvdb-box">
        <div class="vvdb-emoji">👎</div>
        <div class="vvdb-count">
          <div
            data-lyket-type="like"
            data-lyket-id="pluribus-dislike"
            data-lyket-template="minimal"
          ></div>
        </div>
      </div>

    </div>

    <script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_0ba8a20c61113bf11b6f3fef48ae39"></script>
  </body>
</html>
